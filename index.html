<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor {
            background-color: white;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: 50px;
            color: #1e3a8a;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <h1>Hola</h1>
        <p id="mensaje">Bienvenido a mi página web</p>

        <button onclick="saludar()">Saludar</button>
    </div>

    <script>
        function saludar() {
            document.getElementById("mensaje").textContent = "¡Hola! 👋";
        }
    </script>

</body>
</html>
