<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat de saludos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat {
            background-color: white;
            width: 400px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
        }

        #mensajes {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 15px;
        }

        input {
            width: 70%;
            padding: 10px;
        }

        button {
            width: 25%;
            padding: 10px;
            cursor: pointer;
        }

        .usuario {
            text-align: right;
            margin: 10px;
        }

        .bot {
            text-align: left;
            margin: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="chat">

        <h1>Chat</h1>

        <div id="mensajes"></div>

        <input type="text" id="entrada" placeholder="Escribe un saludo">

        <button onclick="saludar()">Enviar</button>

    </div>

    <script>

        function saludar() {

            let texto = document.getElementById("entrada").value;

            if (texto != "") {

                document.getElementById("mensajes").innerHTML +=
                    "<div class='usuario'>" + texto + "</div>";

                document.getElementById("mensajes").innerHTML +=
                    "<div class='bot'>¡Hola! 👋</div>";

                document.getElementById("entrada").value = "";
            }
        }

    </script>

</body>
</html>
