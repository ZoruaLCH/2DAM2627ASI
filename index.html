<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat de saludos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;

            transition: background-color 0.4s, color 0.4s;
        }

        .chat {
            background-color: white;
            width: 400px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);

            transition: background-color 0.4s, box-shadow 0.4s;
        }

        h1 {
            text-align: center;
        }

        #mensajes {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;

            transition: background-color 0.4s, border 0.4s;
        }

        input {
            width: 70%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;

            transition: background-color 0.4s, color 0.4s, border 0.4s;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #enviar {
            width: 25%;
            background-color: #2563eb;
            color: white;
        }

        #tema {
            display: block;
            margin: 0 auto 20px auto;
            background-color: #222;
            color: white;

            transition: transform 0.3s, background-color 0.3s;
        }

        #tema:hover {
            transform: scale(1.08);
        }

        .usuario {
            text-align: right;
            margin: 10px;
        }

        .bot {
            text-align: left;
            margin: 10px;
            color: #2563eb;
        }

        /* MODO OSCURO */

        body.oscuro {
            background-color: #121212;
            color: white;
        }

        body.oscuro .chat {
            background-color: #1e1e1e;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.6);
        }

        body.oscuro #mensajes {
            background-color: #151515;
            border-color: #444;
        }

        body.oscuro input {
            background-color: #2a2a2a;
            color: white;
            border-color: #555;
        }

        body.oscuro input::placeholder {
            color: #999;
        }

        body.oscuro #tema {
            background-color: white;
            color: #222;
        }

        body.oscuro .bot {
            color: #60a5fa;
        }
    </style>
</head>

<body>

    <div class="chat">

        <button id="tema" onclick="cambiarTema()">🌙 Modo oscuro</button>

        <h1>Chat de saludos 👋</h1>

        <div id="mensajes"></div>

        <input type="text" id="entrada" placeholder="Escribe un saludo">

        <button id="enviar" onclick="saludar()">Enviar</button>

    </div>

    <script>

        function saludar() {

            let texto = document.getElementById("entrada").value;

            if (texto != "") {

                document.getElementById("mensajes").innerHTML +=
                    "<div class='usuario'>" + texto + "</div>";

                document.getElementById("mensajes").innerHTML +=
                    "<div class='bot'>¡Hola! 👋</div>";

                document.getElementById("entrada").value = "";
            }
        }


        function cambiarTema() {

            document.body.classList.toggle("oscuro");

            let boton = document.getElementById("tema");

            if (document.body.classList.contains("oscuro")) {
                boton.textContent = "☀️ Modo claro";
            } else {
                boton.textContent = "🌙 Modo oscuro";
            }
        }

    </script>

</body>

</html>

</body>
</html>
